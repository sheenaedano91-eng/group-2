    <div class="section contact-section">

        <h1>Contact Us</h1>

        <p class="contact-text">
            Have questions? You can contact our school using the
            information below or send us a message.
        </p>

        <div class="contact-container">

            <div class="contact-card">
                <h2>Email</h2>
                <p>school@gmail.com</p>
            </div>

            <div class="contact-card">
                <h2>Phone</h2>
                <p>0912-345-6789</p>
            </div>

            <div class="contact-card">
                <h2>Address</h2>
                <p>San Miguel, Philippines</p>
            </div>

        </div>

        <h2>Send Us a Message</h2>

        <form>
            <label>Name</label>
            <input type="text" placeholder="Enter your name" required>

            <label>Email</label>
            <input type="email" placeholder="Enter your email" required>

            <label>Message</label>
            <textarea rows="6" placeholder="Write your message here" required></textarea>

            <input type="submit" value="Send Message">
        </form>

    </div>

</body>
</html>
